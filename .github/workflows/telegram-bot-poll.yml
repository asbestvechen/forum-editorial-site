name: Poll 4ROOM Telegram bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bot dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Restore private bot state
        uses: actions/cache/restore@v4
        with:
          path: bot-state
          key: telegram-bot-state-${{ github.run_id }}
          restore-keys: telegram-bot-state-

      - name: Poll Telegram updates once
        run: npx tsx scripts/telegram-bot.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_ONCE: "true"
          TELEGRAM_OFFSET_FILE: bot-state/telegram-update-offset.txt
          TELEGRAM_DRAFTS_FILE: bot-state/telegram-event-drafts.json
          EVENTS_FILE: public/events.json
          DIST_EVENTS_FILE: public/events.json

      - name: Refresh Telegram feed export
        run: npx tsx scripts/sync-telegram.ts

      - name: Mirror the export into the GitHub Pages root
        run: |
          cp public/events.json events.json
          mkdir -p images/events
          cp -a public/images/events/. images/events/

      - name: Commit changed feed and event
        run: |
          git config user.name "4ROOM Telegram Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json public/events.json public/images/events images
          if git diff --cached --quiet; then
            echo "No Telegram updates"
          else
            git commit -m "Process Telegram bot updates"
            git push
          fi


      - name: Save private bot state
        uses: actions/cache/save@v4
        with:
          path: bot-state
          key: telegram-bot-state-${{ github.run_id }}
