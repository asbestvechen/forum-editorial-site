name: Sync 4ROOM Telegram feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot-poll
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bot dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
        env:
          ADAPTIVE_AI_REGISTRY: https://registry.npmjs.org/

      - name: Refresh Telegram feed export
        run: npx tsx scripts/sync-telegram.ts

      - name: Mirror the export into the GitHub Pages root
        run: |
          cp public/events.json events.json
          mkdir -p images/events
          cp -a public/images/events/. images/events/

      - name: Commit changed feed
        run: |
          git config user.name "4ROOM Telegram Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json public/events.json public/images/events images/events
          if git diff --cached --quiet; then
            echo "No Telegram updates"
          else
            git commit -m "Sync Telegram feed"
            git push
          fi
